# DDEV project for lambda-twelve/one-record.
#
# PHP 8.3 is pinned on purpose: it is the package's minimum version, so what
# runs locally is the oldest runtime we promise to support. CI covers 8.4 and
# 8.5. No database: the package is storage-agnostic and tests use in-memory
# stores.
name: one-record
type: php
docroot: ""
php_version: "8.3"
webserver_type: nginx-fpm
xdebug_enabled: false
omit_containers: [db]
use_dns_when_possible: true
composer_version: "2"
nodejs_version: "22"
corepack_enable: false
# bin/serve (the example server for compliance runs) listens on 8080 inside
# the web container; expose it so newman can also be run from the host.
web_extra_exposed_ports:
  - name: serve
    container_port: 8080
    http_port: 8080
    https_port: 8443
