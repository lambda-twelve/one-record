# Runtime configuration for the NE:ONE container of the interoperability
# suite, read by Quarkus from /app/config/application.properties. The
# per-run values (public host and port, the trusted issuer and its public
# key) come from the environment; see docker-compose.yml.
#
# NE:ONE has no reason to talk to anything during these tests: every outbound
# integration it ships with points at a closed loopback port (connection
# refused at once; a name that does not resolve would hang).
quarkus.oidc.auth-server-url=http://127.0.0.1:9/disabled
quarkus.oidc-client.auth-server-url=http://127.0.0.1:9/disabled
quarkus.oidc-client.credentials.client-secret.value=unused
quarkus.rest-client.notification-client.url=http://127.0.0.1:9
quarkus.rest-client.subscription-client.url=http://127.0.0.1:9
quarkus.rest-client.action-request-client.url=http://127.0.0.1:9
quarkus.s3.endpoint-override=http://127.0.0.1:9
logistics-object-proxy.always-resolve-external=false

# The Kafka producer that forwards received notifications exists in the
# build whatever the setting; with no broker it only retries against
# loopback. Keep it out of readiness and out of the logs.
mp.messaging.outgoing.notifications-forwarded.health-enabled=false
mp.messaging.outgoing.notifications-forwarded.health-readiness-enabled=false
quarkus.log.category."org.apache.kafka".level=ERROR

# Change requests are evaluated on a timer, not synchronously; the suite
# polls, so keep the tick short.
action-request.evaluation.interval=3s

# Who NE:ONE says it is on its server-information document.
neone-server.data-holder.name=NE:ONE interop oracle

quarkus.http.cors.enabled=false
quarkus.http.access-log.enabled=true
