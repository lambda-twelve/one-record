name: CI

# Documentation-only changes (docs/, mkdocs.yml, Markdown files) do not run
# these gates; docs.yml builds and checks the site for them. docs/examples
# is code compiled by tests/Docs, so it stays in.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - 'docs/examples/**'
      - '!mkdocs.yml'
      - '!**.md'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - 'docs/examples/**'
      - '!mkdocs.yml'
      - '!**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: Code style (PER-CS 2.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/php-cs-fixer check --diff

  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        dependencies: [lowest, highest]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, openssl
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}
      - run: vendor/bin/phpunit --no-coverage

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: json, openssl
          coverage: pcov
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpunit --coverage-clover coverage.xml --coverage-text --only-summary-for-coverage-text
      - name: Summarise
        run: |
          php tools/coverage-badge.php coverage.xml coverage.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.json

  compliance:
    name: Compliance collection (newman, API 2.2.0 and 2.3.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: json, openssl
          coverage: none
      - uses: ramsey/composer-install@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bash tests/Compliance/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-reports
          path: .cache/compliance/report-*.xml

  interop:
    name: Interoperability with NE:ONE
    # Builds NE:ONE from source, which is slow; main and manual runs only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: json, openssl
          coverage: none
      - uses: ramsey/composer-install@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and run against NE:ONE
        env:
          NEONE_PUBLIC_HOST: localhost
        run: bash tests/Interop/run.sh
      - name: NE:ONE log
        if: failure()
        run: docker compose -p one-record-interop -f tests/Interop/neone/docker-compose.yml logs --no-color | tail -200

  vocabulary:
    name: Generated vocabulary is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: php bin/generate-vocabulary
      - run: git diff --exit-code --stat -- src/Vocabulary/Generated
