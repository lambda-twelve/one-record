name: Docs

# Builds the documentation site and publishes it to GitHub Pages, together
# with the test coverage report and the coverage badge data the README reads.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Enables Pages (source: GitHub Actions) on a fresh repository, so the
      # first deployment does not fail before anyone has visited Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: json, openssl
          coverage: pcov
      - uses: ramsey/composer-install@v3
      - name: Test coverage report and badge data
        run: |
          vendor/bin/phpunit --coverage-clover coverage.xml --coverage-html site/coverage
          php tools/coverage-badge.php coverage.xml site/coverage.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
